name: Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      localstack:
        image: localstack/localstack-pro:2026.9.0
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        ports:
          - 4566:4566

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."
          timeout 120 bash -c \
            'until curl -sf http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Bootstrap state backend
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://meridian-tofu-state
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name meridian-tofu-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"

      - name: tofu init
        run: tofu init

      - name: tofu fmt
        run: tofu fmt -check

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        shell: bash
        continue-on-error: true
        run: tofu plan -no-color 2>&1 | tee plan.txt

      - name: Post plan comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const cap = 65000;
            const body = [
              '## OpenTofu Plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan.length > cap ? plan.slice(0, cap) + '\n…output truncated' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    services:
      localstack:
        image: localstack/localstack-pro:2026.9.0
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        ports:
          - 4566:4566

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."
          timeout 120 bash -c \
            'until curl -sf http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Bootstrap state backend
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://meridian-tofu-state
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name meridian-tofu-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"

      - name: tofu init
        run: tofu init

      - name: tofu apply
        run: tofu apply -auto-approve